name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PRs: one group per PR, newer pushes cancel older runs. Everything else: one group per
# event and commit, so every main commit keeps its own "CI OK".
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web
    uses: seiunx-dev/ci-templates/.github/workflows/node-ci.yml@v1
    with:
      package-manager: npm
      node-version: "22" # engines >=22.18: server/ runs its TypeScript directly
      # `prepare` would build the library during install; the check's build step does it
      install-command: npm ci --ignore-scripts

  workflows:
    name: Workflow lint
    uses: seiunx-dev/ci-templates/.github/workflows/actionlint.yml@v1

  ci-ok:
    name: CI OK # the only required status check
    if: always()
    needs: [web, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
