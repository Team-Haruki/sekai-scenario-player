version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: thursday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "[Chore] "
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
      # the Live2D plugin targets PixiJS v7
      - dependency-name: pixi.js
        versions: [">=8"]
      - dependency-name: "@pixi/*"
        versions: [">=8"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: thursday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "[Chore] "
